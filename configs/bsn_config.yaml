# BSN数据验证配置文件

# 系统类型 (rubis 或 bsn)
system_type: bsn

# 数据集路径
data_path: bsn_evaluation_data/eval_ident_traces

# 输出目录
output_dir: validation_results/bsn

# 报告模式: simple（简单）或 detailed（详细）
report_mode: detailed

# 期望分布参数
expected_distributions:
  norm1:
    mu: 0.8999
    sigma: 0.0107
    # min_resp_time: 0.8500  # 可选
    # max_resp_time: 0.9500  # 可选

  norm2:
    mu: 1.0349
    sigma: 0.0108

  norm3:
    mu: 0.9674
    sigma: 0.0108

# 验证参数
validation:
  deviation_threshold: 10.0  # 偏离阈值（百分比）
  min_samples: 10            # 最小样本数
