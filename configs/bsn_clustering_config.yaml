# BSN聚类分析配置文件

# 系统类型
system_type: bsn

# 数据路径
data_path: data/bsn/identity

# 聚类算法列表
algorithms:
  - hdbscan
  - gmm
  - affinity_propagation
  - mean_shift

# 算法参数配置（可选）
algorithm_params:
  hdbscan:
    min_cluster_size: 10
    min_samples: 5

  gmm:
    min_clusters: 2
    max_clusters: 10
    covariance_type: full

  affinity_propagation:
    damping: 0.5
    max_iter: 200

  mean_shift:
    bandwidth: null  # null表示自动估计

# 两阶段分布建模
distribution_modeling:
  stage1_clustering_feature: mu
  boundary_trim_points: 10
  candidate_distributions:
    - norm
    - lognorm
    - gamma
    - weibull_min
  partition_context_features:
    - sensor_index
  normality_alpha: 0.05
  enable_context_calibration: true
  context_modeling_method: linear_mu

# 输出配置
output:
  dir: clustering_results/bsn
  visualizations: true
  report: true
  save_learned_distributions: true
  save_per_algorithm_distributions: true
  learned_distributions_path: clustering_results/bsn/learned_distributions.yaml
