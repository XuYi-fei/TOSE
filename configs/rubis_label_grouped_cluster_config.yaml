# RUBIS label-grouped baseline 训练配置

system_type: rubis
data_path: data/rubis/identity

candidate_distributions:
  - norm
  - lognorm
  - gamma
  - weibull_min

normality_alpha: 0.05

output:
  dir: clustering_results/rubis
  learned_distributions_path: clustering_results/rubis/learned_distributions_label_grouped.yaml
