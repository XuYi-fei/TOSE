# RUBIS聚类分析配置文件（stage-2 仅允许高斯分布）

system_type: rubis

data_path: data/rubis/identity

algorithms:
  - hdbscan
  - gmm
  - affinity_propagation
  - mean_shift

algorithm_params:
  hdbscan:
    min_cluster_size: 10
    min_samples: 5

  gmm:
    min_clusters: 2
    max_clusters: 10
    covariance_type: full

  affinity_propagation:
    damping: 0.5
    max_iter: 200

  mean_shift:
    bandwidth: null

distribution_modeling:
  stage1_clustering_feature: mu
  boundary_trim_points: 10
  candidate_distributions:
    - norm
  normality_alpha: 0.05
  enable_context_calibration: true
  context_modeling_method: linear_mu

output:
  dir: clustering_results/rubis/norm_only
  visualizations: true
  report: true
  save_learned_distributions: true
  save_per_algorithm_distributions: true
  learned_distributions_path: clustering_results/rubis/norm_only/learned_distributions.yaml
